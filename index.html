<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD love</title>	    
    <link type="text/css" rel="stylesheet" href="./file/default.css">
    <script type="text/javascript" src="./file/jquery.min.js"></script>
    <script type="text/javascript" src="./file/jscex.min.js"></script>
    <script type="text/javascript" src="./file/jscex-parser.js"></script>
    <script type="text/javascript" src="./file/jscex-jit.js"></script>
    <script type="text/javascript" src="./file/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./file/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./file/love.js" charset="utf-8"></script>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</head>
<body>
    <div id="main">
        <div id="error"><a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a> (<a href="http://firefox.com.cn/download/">Firefox</a>)</div>
        <audio autoplay="autoplay" height="100" width="100" id="myAudio">
            <source src="aud.mp3" type="audio/mp3" />
            <embed height="100" width="100" src="aud.mp3" />
        </audio>
        <div id="wrap">
            <div id="text">
                <div id="code">

                    <span class="say">happiness is here 💞</span><br>
                    <span class="say">Happy Birthday to you🎈</span><br>
                    <span class="say">May Allah bless you 🍀</span><br>
                    <span class="say">And give u many happiness 💕</span><br>
                    <span class="say">love success❤️</span><br>
                    <span class="say">everthything 🥺 ❤️</span><br>
                    <span class="say">Hope u have a great day today ❤️😘</span><br>
                </div>
            </div>
            <div id="clock-box">
                <span id="clock">0 days 0 hours 0 minutes 0 seconds</span> <!-- Change to "6940 days..." if needed -->
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
    </div>

    <script>
    (function() {
        var canvas = $('#canvas');
		
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        // Keep internal resolution fixed for animation, scale via CSS
        var width = 1100;
        var height = 680;
        
        canvas.attr("width", width);
        canvas.attr("height", height);
        
        // Make canvas responsive via CSS
        function updateCanvasSize() {
            var containerWidth = Math.min(1100, window.innerWidth - 20);
            var aspectRatio = 680 / 1100;
            var displayHeight = containerWidth * aspectRatio;
            canvas.css("width", containerWidth + "px");
            canvas.css("height", displayHeight + "px");
        }
        
        updateCanvasSize();
        
        // Update on resize
        $(window).on('resize', function() {
            updateCanvasSize();
        });

        var opts = {
            seed: {
                x: width / 2 - 20,
                color: "rgb(190, 26, 37)",
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: 700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function(e) {
            playAudio();
            var offset = canvas.offset();
            var rect = canvas[0].getBoundingClientRect();
            var scaleX = width / rect.width;
            var scaleY = height / rect.height;
            var x = (e.pageX - offset.left) * scaleX;
            var y = (e.pageY - offset.top) * scaleY;
            if (seed.hover(x, y)) {
                hold = 0; 
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e) {
            var offset = canvas.offset();
            var rect = canvas[0].getBoundingClientRect();
            var scaleX = width / rect.width;
            var scaleY = height / rect.height;
            var x = (e.pageX - offset.left) * scaleX;
            var y = (e.pageY - offset.top) * scaleY;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));
        /* 🔴 SET YOUR START DATE HERE */
        const loveStartDate = new Date("2022-09-10T00:00:00");
        
        var textAnimate = eval(Jscex.compile("async", function () {
            $("#clock-box").show();
            
            // Get the original text to calculate typing duration
            var $code = $("#code");
            var originalText = $code.html();
            
            // Calculate typing duration - count characters the same way typewriter does
            // Typewriter processes HTML string, skipping tags (<...>)
            var textLength = 0;
            var inTag = false;
            for (var i = 0; i < originalText.length; i++) {
                if (originalText[i] === '<') {
                    inTag = true;
                } else if (originalText[i] === '>') {
                    inTag = false;
                } else if (!inTag) {
                    textLength++;
                }
            }
            
            var typingDuration = textLength * 75; // 75ms per character
            
            // Calculate target time from start date to now
            var now = new Date();
            var targetDiff = Math.floor((now - loveStartDate) / 1000);
            if (targetDiff < 0) targetDiff = 0;
            
            var targetDays = Math.floor(targetDiff / (3600 * 24));
            var targetDiffHours = targetDiff % (3600 * 24);
            var targetHours = Math.floor(targetDiffHours / 3600);
            var targetDiffMinutes = targetDiffHours % 3600;
            var targetMinutes = Math.floor(targetDiffMinutes / 60);
            var targetSeconds = targetDiffMinutes % 60;
            
            // Start fast counting clock that animates from 0 to target
            var clockInterval = startFastClock(targetDays, targetHours, targetMinutes, targetSeconds, typingDuration);
            
            // Start typing animation
            $code.show().typewriter();
            
            // Stop clock when typing finishes and set to final value
            setTimeout(function() {
                clearInterval(clockInterval);
                // Set to final calculated time
                document.getElementById("clock").innerHTML =
                    targetDays + " days " + targetHours + " hours " + targetMinutes + " minutes " + targetSeconds + " seconds";
            }, typingDuration);
        }));
	    
        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            textAnimate().start();
        }));
        
        var clockStartTime;
        var currentDays = 0, currentHours = 0, currentMinutes = 0, currentSeconds = 0;
        
        function startFastClock(targetDays, targetHours, targetMinutes, targetSeconds, duration) {
            // Initialize to 0
            currentDays = 0;
            currentHours = 0;
            currentMinutes = 0;
            currentSeconds = 0;
            document.getElementById("clock").innerHTML = "0 days 0 hours 0 minutes 0 seconds";
            
            clockStartTime = new Date();
            var startTime = Date.now();
            
            // Calculate increments per update (update every 30ms for fast counting)
            var updateInterval = 30;
            var totalUpdates = Math.ceil(duration / updateInterval);
            var daysIncrement = targetDays / totalUpdates;
            var hoursIncrement = targetHours / totalUpdates;
            var minutesIncrement = targetMinutes / totalUpdates;
            var secondsIncrement = targetSeconds / totalUpdates;
            
            // Update very fast (every 30ms for smooth fast counting)
            var clockInterval = setInterval(function() {
                var elapsed = Date.now() - startTime;
                var progress = Math.min(elapsed / duration, 1); // 0 to 1
                
                // Animate from 0 to target values
                currentDays = Math.floor(targetDays * progress);
                currentHours = Math.floor(targetHours * progress);
                currentMinutes = Math.floor(targetMinutes * progress);
                currentSeconds = Math.floor(targetSeconds * progress);
                
                document.getElementById("clock").innerHTML =
                    currentDays + " days " + currentHours + " hours " + currentMinutes + " minutes " + currentSeconds + " seconds";
            }, updateInterval);
            
            return clockInterval;
        }
        
      

        runAsync().start();
    })();
    </script>
</body>
</html>
